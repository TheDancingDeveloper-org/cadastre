[project]
name = "cadastre"
version = "0.2.3"
description = "A map of an estate, and the policy for choosing within it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Every dependency is a deployment problem on the collector host (DESIGN §7).
# PyYAML is the only one core is allowed.
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
mcp-server = ["mcp>=1.0"]
mcp-client = ["mcp>=1.0"]
serve = ["mcp>=1.0"]
# Manifest module collectors (MANIFEST.md §5.2/F01). work-git reads Git's
# on-disk format directly (src/cadastre/plugins/collectors/work_git.py)
# instead of shelling out, so no pinned Git reader dependency is needed;
# work-github and work-markdown reuse the base HTTP helper and stdlib. The
# extra is declared for forward compatibility and to name this module's
# collector dependency surface, per §4.1 — it does not activate the module,
# which is controlled solely by modules.yaml.
manifest = []
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "build>=1.2",
]

[project.scripts]
cadastre = "cadastre.cli.main:main"
cadastre-mcp = "cadastre.mcp.server:main"
cadastre-mcp-http = "cadastre.cli.streamable:serve"
cadastre-mcp-remote = "cadastre.mcp.remote:main"
# Plugins are external processes. Built-ins ship here for convenience; nothing
# about the protocol requires an integration to live in this package.
cadastre-plugin-static = "cadastre.plugins.static:main"
cadastre-plugin-exec = "cadastre.plugins.exec_plugin:main"
cadastre-plugin-ingress-caddy = "cadastre.plugins.collectors.ingress_caddy:main"
cadastre-plugin-forge-forgejo = "cadastre.plugins.collectors.forge_forgejo:main"
cadastre-plugin-forge-github = "cadastre.plugins.collectors.forge_github:main"
cadastre-plugin-ci-woodpecker = "cadastre.plugins.collectors.ci_woodpecker:main"
cadastre-plugin-secrets-infisical = "cadastre.plugins.collectors.secrets_infisical:main"
cadastre-plugin-orchestrator-gitops = "cadastre.plugins.collectors.orchestrator_gitops:main"
cadastre-plugin-dns-cloudflare = "cadastre.plugins.collectors.dns_cloudflare:main"
cadastre-plugin-vpn-tailscale = "cadastre.plugins.collectors.vpn_tailscale:main"
cadastre-plugin-hypervisor-proxmox = "cadastre.plugins.collectors.hypervisor_proxmox:main"
cadastre-plugin-registry-crates = "cadastre.plugins.collectors.registry_crates:main"
cadastre-plugin-work-markdown = "cadastre.plugins.collectors.work_markdown:main"
cadastre-plugin-work-git = "cadastre.plugins.collectors.work_git:main"
cadastre-plugin-work-github = "cadastre.plugins.collectors.work_github:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadastre"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = false
source = ["src/cadastre"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Tuple concatenation reads better than unpacking where the spec table builds
# `_common() + (...)`, and where a renderer appends a blank line to a block.
ignore = ["RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["cadastre", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true
