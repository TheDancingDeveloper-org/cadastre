server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  location = /runtime-config.js { alias /tmp/runtime-config.js; }
  location / { try_files $uri /index.html; }
}
